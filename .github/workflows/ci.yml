name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l . | tee /dev/stderr | (! read -r)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

  acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o sift ./cmd/sift
      - name: adults.sift runs and produces the expected output
        run: |
          cd examples
          ../sift run adults.sift
          diff <(printf '%s\n' '{"name":"Ada","age":42}') adults.jsonl
      - name: unmasked PII fails to compile
        run: |
          cat > /tmp/leaky.sift <<'EOF'
          source in  = csv("people.csv", schema: { name: string, email: string @pii })
          sink   out = jsonl("out.jsonl")
          pipeline main {
            in |> out
          }
          EOF
          ! ./sift run /tmp/leaky.sift 2>errors.txt
          grep -q "is @pii and reaches sink" errors.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
