name: Sift CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            # Every platform reports independently; one failure should not hide
            # the others, since platform differences are the point of the matrix.
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            - name: Run Go tests
              uses: ./.github/actions/go/tests

    lint:
        name: Format and vet
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            - name: Check formatting
              run: |
                  set -euo pipefail
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "These files need gofmt:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

            - name: Check go.mod is tidy
              run: |
                  set -euo pipefail
                  go mod tidy
                  git diff --exit-code -- go.mod go.sum

            - name: golangci-lint
              uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
              with:
                  version: v2.11.4

    acceptance:
        name: Language guarantees through the CLI
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            - name: Build the CLI
              run: go build -o sift ./cmd/sift

            - name: adults.sift runs and produces the expected output
              run: |
                  set -euo pipefail
                  cd testdata
                  ../sift run adults.sift
                  diff <(printf '%s\n' '{"name":"Ada","age":42}') adults.jsonl

            # The one guarantee the whole language exists for. If this ever
            # stops being a compile error, nothing else in CI matters.
            - name: unmasked PII fails to compile
              run: |
                  set -euo pipefail
                  cat > leaky.sift <<'EOF'
                  source in  = csv("people.csv", schema: { name: string, email: string @pii })
                  sink   out = jsonl("out.jsonl")
                  pipeline main {
                    in |> out
                  }
                  EOF
                  cp testdata/people.csv .
                  if ./sift run leaky.sift 2>errors.txt; then
                      echo "leaky.sift compiled; it must not"
                      exit 1
                  fi
                  grep -q "is @pii and reaches sink" errors.txt

            # examples/ is the tutorial and is deliberately never read by a Go
            # test, so nothing else would notice if an example stopped running.
            - name: every tutorial example still runs
              env:
                  SIFT_DEIDENTIFY_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
              run: |
                  set -uo pipefail
                  failed=0
                  for f in examples/*.sift; do
                      # on-error-abort.sift demonstrates the abort policy, so a
                      # non-zero exit is its whole point.
                      want=0
                      case "$f" in *on-error-abort.sift) want=1 ;; esac
                      # Capture the status in the if itself: `cmd || true`
                      # would reset $? to 0 before it could be read.
                      if out=$(./sift run "$f" 2>&1); then rc=0; else rc=$?; fi
                      if [ "$rc" -ne "$want" ]; then
                          echo "FAIL $f: exit $rc, want $want"
                          echo "$out"
                          failed=1
                      fi
                  done
                  exit $failed

            # testdata/ is a copy of the examples/ fixtures, kept identical by
            # hand. Drift makes the tutorial and the tests disagree silently.
            - name: examples/ and testdata/ fixtures agree
              run: |
                  set -euo pipefail
                  drift=0
                  for f in testdata/*; do
                      b=$(basename "$f")
                      if [ ! -f "examples/$b" ]; then
                          echo "testdata/$b has no examples/ counterpart"
                          drift=1
                      elif ! cmp -s "$f" "examples/$b"; then
                          echo "testdata/$b and examples/$b differ:"
                          diff "examples/$b" "$f" || true
                          drift=1
                      fi
                  done
                  exit $drift

    fuzz:
        name: Fuzz the frontend
        runs-on: ubuntu-latest
        needs: test
        strategy:
            fail-fast: false
            matrix:
                include:
                    - package: ./internal/parser
                      target: FuzzParse
                    - package: ./internal/checker
                      target: FuzzCheck
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            # A short run per push; it is a smoke test, not a campaign. The
            # seed corpus runs on every `go test` regardless. Malformed input
            # must always produce a diagnostic, never a panic.
            - name: ${{ matrix.target }}
              run: go test ${{ matrix.package }} -run=${{ matrix.target }} -fuzz=${{ matrix.target }} -fuzztime=60s

            - name: Upload any crashing input
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: fuzz-corpus-${{ matrix.target }}
                  path: ${{ matrix.package }}/testdata/fuzz
                  if-no-files-found: ignore

    vuln:
        name: Vulnerability scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            # Reports only vulnerabilities Sift's own code can actually reach,
            # rather than everything in the dependency tree.
            - name: govulncheck
              run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    cross-build:
        name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: darwin
                      goarch: arm64
                    - goos: darwin
                      goarch: amd64
                    - goos: linux
                      goarch: arm64
                    - goos: linux
                      goarch: amd64
                    - goos: windows
                      goarch: amd64
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Go
              uses: ./.github/actions/go/setup

            # CGO stays off so every target is a single static binary; nothing
            # in the dependency tree needs a C toolchain.
            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: "0"
              run: go build -o /dev/null ./cmd/sift
